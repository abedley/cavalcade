<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#efe9dc" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Cavalcade</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="ui/app.css">
</head>
<body>
<main id="app">
  <header class="bar">
    <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>Cavalcade</div>
    <span class="chip" id="deckChip" title="Cards left in the deck">Deck <b id="deck">–</b></span>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <section class="side" id="cpu">
    <div class="side-head">
      <span class="who">CPU</span>
      <span class="cpu-hand" id="cpuHand"></span>
      <span class="pts"><b id="cpuScore">0</b> pts</span>
    </div>
    <div class="tiles" id="cpuTiles"></div>
  </section>

  <section class="parade-zone">
    <div class="parade-labels"><span class="final" id="finalChip" hidden></span><span>Newest</span></div>
    <div class="parade" id="parade"></div>
  </section>

  <section class="status">
    <div class="msg">
      <div class="last" id="lastMove"></div>
      <div class="prompt" id="prompt"></div>
    </div>
    <button class="btn" id="actionBtn" hidden></button>
  </section>

  <section class="side" id="you">
    <div class="tiles" id="youTiles"></div>
    <div class="side-head">
      <span class="who">You</span>
      <span class="hint" id="youHint"></span>
      <span class="pts"><b id="youScore">0</b> pts</span>
    </div>
  </section>

  <section class="hand" id="hand" aria-label="Your hand"></section>
</main>

<dialog id="setup">
  <form method="dialog" class="sheet">
    <h1 class="title"><span class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>Cavalcade</h1>
    <p class="sub">A game of Parade against the computer.</p>
    <label class="field">
      <span class="field-head">Cards per suit <output id="perSuitOut"></output></span>
      <input type="range" id="perSuit" step="1">
      <span class="field-note" id="perSuitNote"></span>
    </label>
    <label class="field">
      <span class="field-head">Seed <span class="field-note">optional, replays the same deal</span></span>
      <input type="number" id="seed" inputmode="numeric" placeholder="Random">
    </label>
    <details class="rules"><summary>How to play</summary><div class="rules-body" data-rules></div></details>
    <div class="sheet-actions">
      <button class="btn big" value="start" id="startBtn" autofocus>Start game</button>
      <button class="btn secondary" value="cancel" id="setupCancel">Cancel</button>
    </div>
  </form>
</dialog>

<dialog id="menu">
  <form method="dialog" class="sheet">
    <div class="sheet-head"><h2>Menu</h2><button class="icon-btn" value="close" aria-label="Close">✕</button></div>
    <div class="menu-list">
      <button class="menu-item" value="new">New game…</button>
      <button class="menu-item" value="results" id="menuResults" hidden>Show results</button>
      <label class="menu-item toggle"><span>Show CPU hand</span><input type="checkbox" id="showCpu"></label>
    </div>
    <details class="rules"><summary>How to play</summary><div class="rules-body" data-rules></div></details>
    <details class="rules" open><summary>Game log</summary><ol id="log"></ol></details>
    <p class="field-note" id="seedNote"></p>
  </form>
</dialog>

<dialog id="results">
  <form method="dialog" class="sheet">
    <div class="sheet-head"><h2 id="resultTitle"></h2><button class="icon-btn" value="close" aria-label="Close">✕</button></div>
    <div class="score-line" id="scoreLine"></div>
    <div id="breakdown"></div>
    <div class="sheet-actions">
      <button class="btn secondary" value="settings">Settings</button>
      <button class="btn big" value="again">Play again</button>
    </div>
  </form>
</dialog>

<script type="module" src="ui/app.js"></script>
</body>
</html>
