<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#fbf4e3"/>
      <stop offset="1" stop-color="#e2cfa6"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2b1d14" flood-opacity=".3"/>
    </filter>
    <!-- A card: suit colour with a parchment inner rule, like the suit tiles. -->
    <g id="card">
      <rect x="-70" y="-200" width="140" height="200" rx="16" fill="currentColor"/>
      <rect x="-60" y="-190" width="120" height="180" rx="9" fill="none" stroke="#fbf5e6" stroke-opacity=".55" stroke-width="4"/>
    </g>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- A fan of the six suits, pivoting below the middle. -->
  <g transform="translate(256 372) scale(1.12)" filter="url(#shadow)">
    <use href="#card" color="#2e241d" transform="rotate(-40) translate(0 -24)"/>
    <use href="#card" color="#74408c" transform="rotate(-24) translate(0 -24)"/>
    <use href="#card" color="#c99a1c" transform="rotate(-8) translate(0 -24)"/>
    <use href="#card" color="#4c7a3b" transform="rotate(8) translate(0 -24)"/>
    <use href="#card" color="#3f6fa6" transform="rotate(24) translate(0 -24)"/>
    <g transform="rotate(40) translate(0 -24)">
      <use href="#card" color="#b5302f"/>
      <!-- The Queen of Hearts. -->
      <path transform="translate(0 -100) scale(2.6)" fill="#fbf5e6"
        d="M0 14 C-4 10 -16 3 -16 -6 C-16 -12 -11 -16 -6.5 -16 C-3.5 -16 -1.3 -14.4 0 -12 C1.3 -14.4 3.5 -16 6.5 -16 C11 -16 16 -12 16 -6 C16 3 4 10 0 14 Z"/>
    </g>
  </g>
</svg>
